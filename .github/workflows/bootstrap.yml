name: Bootstrap source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore repository source
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/part_*.b64 | base64 -d > /tmp/vibecode-source.tar.gz
          tar -xzf /tmp/vibecode-source.tar.gz -C .
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap.yml
          chmod +x deploy/install-agent.sh
      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initial VibeCode agent and Android client"
          git push origin HEAD:main
