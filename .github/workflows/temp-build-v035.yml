name: temp-build-v035
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/temp-build-v035.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/terminal-protocol-v035
          fetch-depth: 0
      - name: Record run id
        run: |
          echo "$GITHUB_RUN_ID" > build-run-id.txt
          git config user.name 'VibeCode CI'
          git config user.email 'actions@users.noreply.github.com'
          git add build-run-id.txt
          git commit -m "Record temporary build run $GITHUB_RUN_ID"
          git push origin HEAD:fix/terminal-protocol-v035
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release unsigned
        working-directory: android
        run: gradle :app:assembleRelease
      - name: Align and collect signer
        shell: bash
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk VibeCode-0.3.5-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vibecode-0.3.5-signing-input
          path: |
            VibeCode-0.3.5-aligned-unsigned.apk
            apksigner.jar
