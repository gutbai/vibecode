          \t\t\treturn s, err
          \t\t}
          \t}
          \treturn s, nil
          }

          func (m *Manager) Get(id string) (*model.Session, bool) { return m.store.GetSession(id) }
          func (m *Manager) List() []*model.Session               { return m.store.ListSessions() }
          ''',
              '''\tif strings.TrimSpace(initialPrompt) != "" {
          \t\tif err := m.waitForProviderReady(ctx, p, s.TMuxName); err != nil {
          \t\t\treturn s, err
          \t\t}
          \t\t_, err := m.SendMessage(ctx, s.ID, initialPrompt, nil)
          \t\tif err != nil {
          \t\t\treturn s, err
          \t\t}
          \t}
