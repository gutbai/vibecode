name: Apply session/mobile terminal fix

on:
  push:
    branches: [fix/session-delete-mobile-terminal-input]
    paths: ['.github/workflows/apply-session-mobile-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-delete-mobile-terminal-input
      - name: Apply code changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def edit(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, got {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          # Agent: persistent session deletion.
          edit(
              'agent/internal/store/store.go',
              '''func (s *Store) AddMessage(sessionID string, m model.SessionMessage) error {''',
              '''func (s *Store) DeleteSession(id string) error {
          \ts.mu.Lock()
          \tdefer s.mu.Unlock()
          \tif _, ok := s.Sessions[id]; !ok {
          \t\treturn os.ErrNotExist
          \t}
          \tdelete(s.Sessions, id)
          \tfor attachmentID, attachment := range s.Attachments {
          \t\tif attachment.SessionID == id {
          \t\t\tdelete(s.Attachments, attachmentID)
          \t\t}
          \t}
          \treturn s.persistLocked()
          }

          func (s *Store) AddMessage(sessionID string, m model.SessionMessage) error {'''
          )

          # Agent: don't fire the first prompt into a CLI before its TUI is ready.
          edit(
