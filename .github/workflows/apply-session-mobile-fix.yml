          }

          func (m *Manager) Get(id string) (*model.Session, bool) { return m.store.GetSession(id) }
          func (m *Manager) List() []*model.Session               { return m.store.ListSessions() }

          func (m *Manager) waitForProviderReady(ctx context.Context, p Provider, tmuxName string) error {
          \tdeadline := time.Now().Add(10 * time.Second)
          \tticker := time.NewTicker(250 * time.Millisecond)
          \tdefer ticker.Stop()
          \tlastOutput := ""
          \tstableSamples := 0
          \tfor {
          \t\tif !p.Exists(ctx, tmuxName) {
          \t\t\treturn errors.New("session exited during startup")
          \t\t}
          \t\tout, _ := p.Capture(ctx, tmuxName, 120)
          \t\tif strings.TrimSpace(out) != "" {
          \t\t\tif inferStatus(out, true) == model.StatusWaitingInput {
          \t\t\t\treturn nil
          \t\t\t}
          \t\t\tif out == lastOutput {
          \t\t\t\tstableSamples++
          \t\t\t} else {
          \t\t\t\tlastOutput = out
          \t\t\t\tstableSamples = 0
          \t\t\t}
          \t\t\tif stableSamples >= 2 {
          \t\t\t\treturn nil
          \t\t\t}
          \t\t}
          \t\tif time.Now().After(deadline) {
          \t\t\treturn nil
          \t\t}
          \t\tselect {
          \t\tcase <-ctx.Done():
          \t\t\treturn ctx.Err()
          \t\tcase <-ticker.C:
          \t\t}
          \t}
          }
          '''
          )

