name: Run session fix v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/session-delete-mobile-terminal-input'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-delete-mobile-terminal-input
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {n}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # ---------- Agent store/delete ----------
          path = 'agent/internal/store/store.go'
          marker = 'func (s *Store) AddMessage(sessionID string, m model.SessionMessage) error {'
          insert = '''func (s *Store) DeleteSession(id string) error {
          \ts.mu.Lock()
          \tdefer s.mu.Unlock()
          \tif _, ok := s.Sessions[id]; !ok {
          \t\treturn os.ErrNotExist
          \t}
          \tdelete(s.Sessions, id)
          \tfor attachmentID, attachment := range s.Attachments {
          \t\tif attachment.SessionID == id {
          \t\t\tdelete(s.Attachments, attachmentID)
          \t\t}
          \t}
          \treturn s.persistLocked()
          }

          '''
          replace_once(path, marker, insert + marker)

          # ---------- Agent manager: wait for TUI before first prompt ----------
          path = 'agent/internal/session/manager.go'
          old = '\tif strings.TrimSpace(initialPrompt) != "" {\n\t\t_, err := m.SendMessage(ctx, s.ID, initialPrompt, nil)\n\t\tif err != nil {\n\t\t\treturn s, err\n\t\t}\n\t}\n'
          new = '\tif strings.TrimSpace(initialPrompt) != "" {\n\t\tif err := m.waitForProviderReady(ctx, p, s.TMuxName); err != nil {\n\t\t\treturn s, err\n\t\t}\n\t\t_, err := m.SendMessage(ctx, s.ID, initialPrompt, nil)\n\t\tif err != nil {\n\t\t\treturn s, err\n\t\t}\n\t}\n'
          replace_once(path, old, new)

          marker = 'func (m *Manager) SendMessage(ctx context.Context, sessionID, text string, attachments []model.Attachment) (*model.SessionMessage, error) {'
          helper = '''func (m *Manager) waitForProviderReady(ctx context.Context, p Provider, tmuxName string) error {
          \tdeadline := time.Now().Add(10 * time.Second)
          \tticker := time.NewTicker(250 * time.Millisecond)
          \tdefer ticker.Stop()
          \tlastOutput := ""
          \tstableSamples := 0
          \tfor {
          \t\tif !p.Exists(ctx, tmuxName) {
          \t\t\treturn errors.New("session exited during startup")
          \t\t}
          \t\tout, _ := p.Capture(ctx, tmuxName, 120)
          \t\tif strings.TrimSpace(out) != "" {
          \t\t\tif inferStatus(out, true) == model.StatusWaitingInput {
          \t\t\t\treturn nil
          \t\t\t}
          \t\t\tif out == lastOutput {
          \t\t\t\tstableSamples++
          \t\t\t} else {
          \t\t\t\tlastOutput = out
          \t\t\t\tstableSamples = 0
          \t\t\t}
          \t\t\tif stableSamples >= 2 {
          \t\t\t\treturn nil
          \t\t\t}
          \t\t}
          \t\tif time.Now().After(deadline) {
          \t\t\treturn nil
          \t\t}
          \t\tselect {
          \t\tcase <-ctx.Done():
          \t\t\treturn ctx.Err()
          \t\tcase <-ticker.C:
          \t\t}
          \t}
          }

          '''
          replace_once(path, marker, helper + marker)

          marker = 'func (m *Manager) SaveAttachment(sessionID, originalName, mime string, size int64, sha string, srcTemp string) (model.Attachment, error) {'
          delete_method = '''func (m *Manager) Delete(ctx context.Context, id string) error {
          \tm.mu.Lock()
          \tdefer m.mu.Unlock()
          \ts, ok := m.store.GetSession(id)
          \tif !ok {
          \t\treturn os.ErrNotExist
          \t}
          \tif p := m.providers[s.Provider]; p != nil && p.Exists(ctx, s.TMuxName) {
          \t\tif err := p.Stop(ctx, s.TMuxName); err != nil {
          \t\t\treturn err
          \t\t}
          \t}
          \tif err := m.store.DeleteSession(id); err != nil {
          \t\treturn err
          \t}
          \t_ = os.RemoveAll(filepath.Join(m.cfg.DataDir, "sessions", id))
          \tm.publish("session.deleted", id, map[string]bool{"deleted": true})
          \treturn nil
          }

          '''
          replace_once(path, marker, delete_method + marker)
          replace_once(path, 'func (m *Manager) poll(ctx context.Context) {\n\tfor _, s := range m.store.ListSessions() {', 'func (m *Manager) poll(ctx context.Context) {\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tfor _, s := range m.store.ListSessions() {')

          # ---------- Agent HTTP delete route ----------
          path = 'agent/internal/api/server.go'
          replace_once(path, '\tmux.HandleFunc("GET /api/sessions/{id}", s.auth(s.getSession))\n', '\tmux.HandleFunc("GET /api/sessions/{id}", s.auth(s.getSession))\n\tmux.HandleFunc("DELETE /api/sessions/{id}", s.auth(s.deleteSession))\n')
          marker = 'func writeTemp(file multipart.File, max int64) (string, int64, string, error) {'
          handler = '''func (s *Server) deleteSession(w http.ResponseWriter, r *http.Request) {
          \tif err := s.sessions.Delete(r.Context(), r.PathValue("id")); err != nil {
          \t\tif errors.Is(err, os.ErrNotExist) {
          \t\t\terrOut(w, http.StatusNotFound, err)
          \t\t\treturn
          \t\t}
          \t\terrOut(w, 400, err)
          \t\treturn
          \t}
          \tjsonOut(w, 200, map[string]bool{"ok": true})
          }

          '''
          replace_once(path, marker, handler + marker)

          # ---------- Android API/repository ----------
          path = 'android/app/src/main/java/com/vibecode/mobile/data/ApiClient.kt'
          marker = '    private fun parseError(raw:String)='
          helper = '''    private suspend inline fun <reified T> delete(path:String):T = withContext(Dispatchers.IO) {
                  http.newCall(req(path).delete().build()).execute().use { r ->
                      val text=r.body?.string().orEmpty(); if(!r.isSuccessful) throw ApiException(r.code, parseError(text)); json.decodeFromString<T>(text)
                  }
              }
          '''
          replace_once(path, marker, helper + marker)
          replace_once(path, '    suspend fun stopSession(id:String) { post<OkResponse,Map<String,String>>("/api/sessions/$id/stop", emptyMap()) }\n', '    suspend fun stopSession(id:String) { post<OkResponse,Map<String,String>>("/api/sessions/$id/stop", emptyMap()) }\n    suspend fun deleteSession(id:String) { delete<OkResponse>("/api/sessions/$id") }\n')

          path = 'android/app/src/main/java/com/vibecode/mobile/data/VibeRepository.kt'
          replace_once(path, '    suspend fun stop(id:String)=call{it.stopSession(id)}\n', '    suspend fun stop(id:String)=call{it.stopSession(id)}\n    suspend fun delete(id:String){ call{it.deleteSession(id)}; refresh() }\n')

          # ---------- Android Sessions list delete UI ----------
          path = 'android/app/src/main/java/com/vibecode/mobile/ui/SessionsScreen.kt'
          replace_once(path, 'import androidx.compose.material.icons.filled.Add\n', 'import androidx.compose.material.icons.filled.Add\nimport androidx.compose.material.icons.filled.Delete\n')
          replace_once(path, 'import androidx.compose.material3.Icon\n', 'import androidx.compose.material3.Icon\nimport androidx.compose.material3.IconButton\n')
          replace_once(path, '    var create by remember { mutableStateOf(false) }\n', '    var create by remember { mutableStateOf(false) }\n    var pendingDelete by remember { mutableStateOf<Session?>(null) }\n')
          replace_once(path, '                SessionCard(session) { onOpen(session.id) }\n', '                SessionCard(session = session, onClick = { onOpen(session.id) }, onDelete = { pendingDelete = session })\n')
          marker = '\n}\n\n@Composable\nprivate fun StatusFilterGrid'
          dialog = '''

              pendingDelete?.let { target ->
                  AlertDialog(
                      onDismissRequest = { pendingDelete = null },
                      title = { Text("Xóa session?") },
                      text = { Text("Session '${target.title.ifBlank { target.id }}' sẽ bị dừng và xóa khỏi VPS, gồm cả attachment của session.") },
                      confirmButton = {
                          TextButton(onClick = {
                              scope.launch {
                                  runCatching { repo.delete(target.id) }
                                  pendingDelete = null
                              }
                          }) { Text("Xóa") }
                      },
                      dismissButton = { TextButton(onClick = { pendingDelete = null }) { Text("Hủy") } },
                  )
              }
          '''
          replace_once(path, marker, dialog + marker)
          replace_once(path, 'private fun SessionCard(\n    session: Session,\n    onClick: () -> Unit,\n) {', 'private fun SessionCard(\n    session: Session,\n    onClick: () -> Unit,\n    onDelete: () -> Unit,\n) {')
          replace_once(path, '                StatusBadge(session.status)\n', '                StatusBadge(session.status)\n                IconButton(onClick = onDelete) {\n                    Icon(Icons.Default.Delete, contentDescription = "Xóa session")\n                }\n')

          # ---------- Android terminal input UX + delete ----------
          path = 'android/app/src/main/java/com/vibecode/mobile/ui/TerminalSessionScreen.kt'
          replace_once(path, 'import android.graphics.Color as AndroidColor\n', 'import android.graphics.Color as AndroidColor\nimport android.view.MotionEvent\n')
          replace_once(path, 'import androidx.compose.material.icons.filled.ChatBubbleOutline\n', 'import androidx.compose.material.icons.filled.ChatBubbleOutline\nimport androidx.compose.material.icons.filled.Delete\n')
          replace_once(path, '    var terminalDiagnostic by remember(id) { mutableStateOf<String?>(null) }\n', '    var terminalDiagnostic by remember(id) { mutableStateOf<String?>(null) }\n    var confirmDelete by remember(id) { mutableStateOf(false) }\n')
          replace_once(path, '            val imm = context.getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager\n            imm.showSoftInput(webView, InputMethodManager.SHOW_IMPLICIT)\n', '            val imm = context.getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager\n            webView.postDelayed({ imm.showSoftInput(webView, InputMethodManager.SHOW_IMPLICIT) }, 100)\n')
          replace_once(path, '                    IconButton(onClick = onOpenChat) {\n                        Icon(Icons.Default.ChatBubbleOutline, "Chat mode")\n                    }\n', '                    IconButton(onClick = onOpenChat) {\n                        Icon(Icons.Default.ChatBubbleOutline, "Chat mode")\n                    }\n                    IconButton(onClick = { confirmDelete = true }) {\n                        Icon(Icons.Default.Delete, "Xóa session")\n                    }\n')
          marker = '            Row(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .horizontalScroll(rememberScrollState())\n                    .padding(horizontal = 6.dp, vertical = 5.dp),'
          hint = '''            Text(
                      text = if (session?.status == "WAITING_INPUT") "Cần nhập: chạm vào terminal để mở bàn phím" else "Chạm vào terminal để nhập",
                      modifier = Modifier.padding(horizontal = 10.dp, vertical = 2.dp),
                      style = MaterialTheme.typography.labelSmall,
                      color = if (session?.status == "WAITING_INPUT") MaterialTheme.colorScheme.tertiary else MaterialTheme.colorScheme.onSurfaceVariant,
                      fontFamily = FontFamily.Monospace,
                  )
          '''
          replace_once(path, marker, hint + marker)
          replace_once(path, '            ) {\n                TerminalKey("Esc") { sendSpecialKey("ESC") }\n', '            ) {\n                FilledTonalIconButton(onClick = { showKeyboard() }) {\n                    Icon(Icons.Default.Keyboard, "Mở bàn phím")\n                }\n                TerminalKey("Esc") { sendSpecialKey("ESC") }\n')
          replace_once(path, '                TerminalKey("Paste") { pasteClipboard() }\n                FilledTonalIconButton(onClick = { showKeyboard() }) {\n                    Icon(Icons.Default.Keyboard, "Show keyboard")\n                }\n', '                TerminalKey("Paste") { pasteClipboard() }\n')

          marker = '\n}\n\n@Composable\nprivate fun TerminalKey'
          confirm = '''

              if (confirmDelete) {
                  AlertDialog(
                      onDismissRequest = { confirmDelete = false },
                      title = { Text("Xóa session?") },
                      text = { Text("Session này sẽ bị dừng và xóa khỏi VPS.") },
                      confirmButton = {
                          TextButton(onClick = {
                              confirmDelete = false
                              scope.launch {
                                  runCatching { repo.delete(id) }
                                      .onSuccess { onBack() }
                                      .onFailure { actionError = it.message }
                              }
                          }) { Text("Xóa") }
                      },
                      dismissButton = { TextButton(onClick = { confirmDelete = false }) { Text("Hủy") } },
                  )
              }
          '''
          replace_once(path, marker, confirm + marker)
          replace_once(path, '                isFocusableInTouchMode = true\n                settings.javaScriptEnabled = true\n', '''                isFocusableInTouchMode = true
                          setOnTouchListener { _, event ->
                              if (event.action == MotionEvent.ACTION_DOWN) {
                                  requestFocus()
                                  evaluateJavascript("window.vibeFocus && window.vibeFocus();", null)
                                  val imm = context.getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                                  postDelayed({ imm.showSoftInput(this, InputMethodManager.SHOW_IMPLICIT) }, 100)
                              }
                              false
                          }
                          settings.javaScriptEnabled = true
          ''')
          replace_once(path, '                        super.onReceivedError(view, request, error)\n                        val target = request?.url?.let { "${it.scheme}://${it.host}${it.path}" }.orEmpty()\n', '                        super.onReceivedError(view, request, error)\n                        if (request?.url?.path == "/favicon.ico") return\n                        val target = request?.url?.let { "${it.scheme}://${it.host}${it.path}" }.orEmpty()\n')
          replace_once(path, '  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />\n', '  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />\n  <link rel="icon" href="data:," />\n')
          replace_once(path, '    term.onData(sendInput);\n    term.onResize', '    term.onData(sendInput);\n    document.getElementById(\'terminal\').addEventListener(\'pointerdown\', () => term.focus());\n    term.onResize')

          # Version bump.
          Path('android/version.properties').write_text('VERSION_CODE=6\nVERSION_NAME=0.3.3\n')

          # Store deletion regression test.
          Path('agent/internal/store/store_delete_test.go').write_text('''package store

          import (
          \t"testing"

          \t"github.com/gutbai/vibecode/agent/internal/model"
          )

          func TestDeleteSessionRemovesSessionAndAttachments(t *testing.T) {
          \tdir := t.TempDir()
          \ts, err := Open(dir)
          \tif err != nil { t.Fatal(err) }
          \tif err := s.PutSession(&model.Session{ID: "s1"}); err != nil { t.Fatal(err) }
          \tif err := s.PutAttachment(model.Attachment{ID: "a1", SessionID: "s1"}); err != nil { t.Fatal(err) }
          \tif err := s.PutAttachment(model.Attachment{ID: "a2", SessionID: "other"}); err != nil { t.Fatal(err) }
          \tif err := s.DeleteSession("s1"); err != nil { t.Fatal(err) }
          \tif _, ok := s.GetSession("s1"); ok { t.Fatal("session still exists") }
          \tif _, ok := s.Attachments["a1"]; ok { t.Fatal("session attachment still exists") }
          \tif _, ok := s.Attachments["a2"]; !ok { t.Fatal("unrelated attachment was removed") }
          }
          ''')
          PY

          rm -f .github/workflows/apply-session-mobile-fix.yml .github/workflows/run-session-fix.yml .github/workflows/run-session-fix-v2.yml
          git config user.name "VibeCode CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix mobile terminal input and session lifecycle"
          git push origin HEAD:fix/session-delete-mobile-terminal-input
