name: Android CI
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: android
        run: gradle :app:assembleRelease
      - name: Collect APK and apksigner
        run: |
          mkdir -p "$RUNNER_TEMP/vibecode-sign-input"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/vibecode-sign-input/VibeCode-0.3.2-unsigned.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          cp "$APKSIGNER" "$RUNNER_TEMP/vibecode-sign-input/apksigner"
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" "$RUNNER_TEMP/vibecode-sign-input/apksigner.jar"
          chmod +x "$RUNNER_TEMP/vibecode-sign-input/apksigner"
      - uses: actions/upload-artifact@v4
        with:
          name: vibecode-032-sign-input
          path: ${{ runner.temp }}/vibecode-sign-input/
