name: Agent
on:
  push:
    paths: ['agent/**', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/vibecode-agent
