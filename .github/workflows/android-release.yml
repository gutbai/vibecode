name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android release signing is not configured. Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Prepare signed release
        id: version
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' android/version.properties | tr -d '\r' | tail -n 1)"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' android/version.properties | tr -d '\r' | tail -n 1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          case "$VERSION_CODE" in *[!0-9]*|'') echo "Invalid VERSION_CODE=$VERSION_CODE"; exit 1;; esac
          KEYSTORE_PATH="$RUNNER_TEMP/vibecode-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Publishing Android version $VERSION_NAME (code $VERSION_CODE)"

      - name: Build signed APK
        working-directory: android
        env:
          VIBECODE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VIBECODE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VIBECODE_KEYSTORE_PATH: ${{ steps.version.outputs.keystore_path }}
          VIBECODE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIBECODE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIBECODE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$RUNNER_TEMP/VibeCode.apk"
          sha256sum "$RUNNER_TEMP/VibeCode.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          TAG="android-v${VERSION_CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/VibeCode.apk#VibeCode.apk" --clobber
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/VibeCode.apk#VibeCode.apk" \
              --target "$GITHUB_SHA" \
              --title "VibeCode Android ${VERSION_NAME}" \
              --notes "Signed Android build ${VERSION_NAME} (versionCode ${VERSION_CODE}). In-app updates use this android-v${VERSION_CODE} release and keep saved VPS connections when the signing key matches."
          fi

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibecode-release-${{ steps.version.outputs.version_name }}
          path: ${{ runner.temp }}/VibeCode.apk
