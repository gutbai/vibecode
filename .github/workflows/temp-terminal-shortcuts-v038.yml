name: temp-terminal-shortcuts-v038
on:
  push:
    branches: ['feat/terminal-shortcuts-v038']
    paths: ['.github/workflows/temp-terminal-shortcuts-v038.yml']
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/terminal-shortcuts-v038
          fetch-depth: 0
      - name: Patch terminal controls and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/vibecode/mobile/ui/TerminalSessionScreen.kt')
          s = p.read_text()

          # Remove the HTTP endpoint probe from the terminal screen. Diagnostics remain in Logs.
          old_probe = '''        runCatching { repo.terminalProbe(id) }\n            .onSuccess { probe ->\n                terminalDiagnostic = "Endpoint: $probe"\n                AppLog.add("INFO", "terminal-probe", probe)\n            }\n            .onFailure { error ->\n                terminalDiagnostic = "Probe lỗi: ${error.message}"\n                AppLog.add("ERROR", "terminal-probe", error.message ?: error.toString())\n            }\n'''
          if old_probe not in s:
              raise SystemExit('terminal probe block not found')
          s = s.replace(old_probe, '')

          # Remove the inline diagnostic/endpoint text block; logs already contain diagnostics.
          old_diag = '''            terminalDiagnostic?.let { diagnostic ->\n                Text(\n                    diagnostic,\n                    modifier = Modifier.padding(horizontal = 10.dp, vertical = 2.dp),\n                    fontFamily = FontFamily.Monospace,\n                    style = MaterialTheme.typography.labelSmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                    maxLines = 2,\n                )\n            }\n\n'''
          if old_diag not in s:
              raise SystemExit('terminal diagnostic UI block not found')
          s = s.replace(old_diag, '')

          # Remove the helper line under the terminal to give more vertical space.
          old_hint = '''            Text(\n            text = if (session?.status == "WAITING_INPUT") "Cần nhập: chạm vào terminal để mở bàn phím" else "Chạm vào terminal để nhập",\n            modifier = Modifier.padding(horizontal = 10.dp, vertical = 2.dp),\n            style = MaterialTheme.typography.labelSmall,\n            color = if (session?.status == "WAITING_INPUT") MaterialTheme.colorScheme.tertiary else MaterialTheme.colorScheme.onSurfaceVariant,\n            fontFamily = FontFamily.Monospace,\n        )\n'''
          if old_hint not in s:
              raise SystemExit('terminal helper text block not found')
          s = s.replace(old_hint, '')

          old_row = '''                TerminalKey("Esc") { sendSpecialKey("ESC") }\n                TerminalKey("Ctrl+A") { sendSpecialKey("CTRL_A") }\n                TerminalKey("Ctrl+C") { sendSpecialKey("CTRL_C") }\n                TerminalKey("Tab") { sendSpecialKey("TAB") }\n                TerminalKey("←") { sendSpecialKey("LEFT") }\n                TerminalKey("↑") { sendSpecialKey("UP") }\n                TerminalKey("↓") { sendSpecialKey("DOWN") }\n                TerminalKey("→") { sendSpecialKey("RIGHT") }\n                TerminalKey("Enter") { sendSpecialKey("ENTER") }\n                TerminalKey("Paste") { pasteClipboard() }'''
          new_row = '''                TerminalKey("Del") { sendSpecialKey("DELETE") }\n                TerminalKey("Esc") { sendSpecialKey("ESC") }\n                TerminalKey("Ctrl+A") { sendSpecialKey("CTRL_A") }\n                TerminalKey("Ctrl+C") { sendSpecialKey("CTRL_C") }\n                TerminalKey("Shift+Tab") { sendSpecialKey("SHIFT_TAB") }\n                TerminalKey("Tab") { sendSpecialKey("TAB") }\n                TerminalKey("←") { sendSpecialKey("LEFT") }\n                TerminalKey("↑") { sendSpecialKey("UP") }\n                TerminalKey("↓") { sendSpecialKey("DOWN") }\n                TerminalKey("→") { sendSpecialKey("RIGHT") }\n                TerminalKey("Enter") { sendSpecialKey("ENTER") }\n                TerminalKey("Paste") { pasteClipboard() }'''
          if old_row not in s:
              raise SystemExit('terminal key row not found')
          s = s.replace(old_row, new_row)

          old_keys = "        ESC:'\\x1b', TAB:'\\t', ENTER:'\\r', CTRL_A:'\\x01', CTRL_C:'\\x03',"
          new_keys = "        ESC:'\\x1b', TAB:'\\t', SHIFT_TAB:'\\x1b[Z', DELETE:'\\x1b[3~', ENTER:'\\r', CTRL_A:'\\x01', CTRL_C:'\\x03',"
          if old_keys not in s:
              raise SystemExit('terminal key mapping not found')
          s = s.replace(old_keys, new_keys)

          # Diagnostics stay in the Logs tab; do not surface warnings over the terminal anymore.
          old_diag_callback = '''                        onDiagnostic = { level, source, message ->\n                            AppLog.add(level, source, message)\n                            if (level.equals("ERROR", true) || level.equals("WARN", true)) {\n                                terminalDiagnostic = message\n                            }\n                        },'''
          new_diag_callback = '''                        onDiagnostic = { level, source, message ->\n                            AppLog.add(level, source, message)\n                        },'''
          if old_diag_callback not in s:
              raise SystemExit('terminal diagnostic callback not found')
          s = s.replace(old_diag_callback, new_diag_callback)
          s = s.replace('    var terminalDiagnostic by remember(id) { mutableStateOf<String?>(null) }\n', '')
          p.write_text(s)

          v = Path('android/version.properties')
          v.write_text('# Canonical Android release version.\nVERSION_CODE=11\nVERSION_NAME=0.3.8\n')
          PY
          git config user.name 'VibeCode CI'
          git config user.email 'actions@users.noreply.github.com'
          git add android/app/src/main/java/com/vibecode/mobile/ui/TerminalSessionScreen.kt android/version.properties
          git commit -m 'Improve terminal auxiliary controls'
          echo "$GITHUB_RUN_ID" > build-run-id-v038.txt
          git add build-run-id-v038.txt
          git commit -m "Record VibeCode 0.3.8 build run $GITHUB_RUN_ID"
          git push origin HEAD:feat/terminal-shortcuts-v038
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android release unsigned
        working-directory: android
        run: gradle :app:assembleRelease
      - name: Align APK and collect apksigner
        shell: bash
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk VibeCode-0.3.8-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vibecode-0.3.8-signing-input
          path: |
            VibeCode-0.3.8-aligned-unsigned.apk
            apksigner.jar
